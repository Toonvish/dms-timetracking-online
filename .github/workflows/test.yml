name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test
      - name: plugin.json is valid
        run: node -e "const p=require('./plugin.json'); for (const k of ['id','name','component','settings']) if (!p[k]) throw new Error('missing '+k)"
